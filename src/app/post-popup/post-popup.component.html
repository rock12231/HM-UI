{{postData|json}}
<div class="card">
  <div class="card-header">
    <img src="assets/img/user.jpg" class="rounded-circle" width="30" height="30" alt="..."> {{ postData.user }}
  </div>
  <div class="card-body">
    <div class="row">
      <div class="col-2">

      </div>
      <div class="col-10">
        <h6 class="card-title text-dark">{{ postData.title }}</h6>
        <p class="card-text"><small class="text-muted">{{ postData.created_at | date }}</small></p>
        <p class="card-text">{{ postData.content }}</p>
      </div>
    </div>
  </div>
  <div class="card-footer">
    <button type="button" class="btn btn-sm btn-outline-primary mr-1"><i class="fas fa-comment"></i>
      Comment</button>
    <button type="button" class="btn btn-sm btn-outline-secondary mr-1"><i class="fas fa-share"></i>
      Share</button>
    <button type="button" class="btn btn-sm btn-outline-success mr-1"><i class="fas fa-thumbs-up"></i>
      Interested</button>
    <button type="button" class="btn btn-sm btn-outline-danger mr-1"><i class="fas fa-times"></i> Close</button>
  </div>
</div>




  </div>
</div>
